[workspace]
members = [
    "crates/neort-dsp",
    "crates/neort-float",
    "crates/neort-io",
    "examples/plugin",
    "examples/plugin/xtask",
]
resolver = "2"

[workspace.package]
authors = ["Stephan Eckes <stephan@neodsp.com>"]
categories = ["multimedia::audio"]
description = "neort is a framework for real-time audio applications"
edition = "2021"
keywords = ["neodsp", "audio", "dsp", "real-time"]
license = "MIT OR Apache-2.0"
readme = "README.md"
repository = "https://github.com/neodsp/neort"
version = "0.0.0"

[workspace.dependencies]
neort = { path = "." }
neort-dsp = { path = "crates/neort-dsp" }
neort-float = { path = "crates/neort-float" }
neort-io = { path = "crates/neort-io" }

approx = "0.5.1"
audio-blocks = "0.2.0"
criterion = "0.5.1"
cxx-juce = "0.8.0"
event-listener = "5.4"
num-complex = { version = "0.4", default-features = false }
num-integer = { version = "0.1", default-features = false }
num-traits = { version = "0.2.19", default-features = false }
realfft = "3.4"
ringbuf = "0.4"
rtsan-standalone = "0.1"
serde = { version = "1.0", features = ["derive"] }
thiserror = "2.0"

[package]
authors.workspace = true
categories.workspace = true
description.workspace = true
edition.workspace = true
keywords.workspace = true
license.workspace = true
name = "neort"
readme.workspace = true
repository.workspace = true
version.workspace = true

[dependencies]
neort-dsp = { workspace = true }
neort-io = { workspace = true }
