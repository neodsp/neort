[workspace]
members = ["crates/neort-blocks", "crates/neort-dsp", "crates/neort-io"]
resolver = "2"

[workspace.package]
authors = ["Stephan Eckes <stephan@neodsp.com>"]
categories = ["multimedia::audio"]
description = "neort is a framework for real-time audio applications"
edition = "2021"
keywords = ["neodsp", "audio", "dsp", "real-time"]
license = "MIT OR Apache-2.0"
readme = "README.md"
repository = "https://github.com/neodsp/neort"
version = "0.0.0"

[workspace.dependencies]
neort-blocks = { path = "crates/neort-blocks" }
neort-dsp = { path = "crates/neort-dsp" }

criterion = "0.5.1"
num = "0.4"
realfft = "3.4"
ringbuf = "0.4"
rtsan = { git = "https://github.com/realtime-sanitizer/rtsan-standalone-rs", branch = "dev" }

[package]
authors.workspace = true
categories.workspace = true
description.workspace = true
edition.workspace = true
keywords.workspace = true
license.workspace = true
name = "neort"
readme.workspace = true
repository.workspace = true
version.workspace = true

[dependencies]
neort-blocks = { workspace = true }
neort-dsp = { workspace = true }
